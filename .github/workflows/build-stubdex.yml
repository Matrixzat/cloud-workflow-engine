name: Build stub.dex only

# Fast workflow — no OLLVM, no C compilation.
# Use this whenever stub-loader Java sources change (ProxyApplication, DexProtector, Reflect, Const).
# Java sources live in the Replit workspace at stub-loader/src/main/java/
# Mirror changes to cloud repo stub-loader/ then dispatch this workflow.
# Output: artifact "stub-dex" containing stub.dex — commit to src/main/assets/stub.dex

on:
  workflow_dispatch:

jobs:
  build-stubdex:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform tools
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Build stub.dex
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"
          D8=$(find "$SDK/build-tools" -name "d8" | sort -V | tail -1)
          ANDROID_JAR=$(find "$SDK/platforms/android-34" -name "android.jar" | head -1)
          echo "d8:          $D8"
          echo "android.jar: $ANDROID_JAR"

          mkdir -p stub_classes
          javac -source 8 -target 8 \
            -cp "$ANDROID_JAR" \
            -d stub_classes \
            stub-loader/com/secure/dex/data/Const.java \
            stub-loader/com/secure/dex/utils/DexProtector.java \
            stub-loader/com/secure/dex/utils/Reflect.java \
            stub-loader/com/ultra/dex2cvmp/ProxyApplication.java

          "$D8" \
            --output . \
            --min-api 21 \
            --lib "$ANDROID_JAR" \
            $(find stub_classes -name "*.class")

          mv classes.dex stub.dex
          echo "✅ stub.dex — $(wc -c < stub.dex) bytes"

      - name: Upload stub.dex
        uses: actions/upload-artifact@v4
        with:
          name: stub-dex
          retention-days: 90
          path: stub.dex
