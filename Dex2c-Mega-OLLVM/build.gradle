plugins {
    id 'com.android.application' version '8.3.2'
}

android {
    namespace 'com.dex2c.mega'
    compileSdk 34

    defaultConfig {
        applicationId "com.dex2c.mega"
        minSdk 26
        targetSdk 28
        versionCode 11
        versionName "11.1"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        // Credentials are in gradle.properties (auto-loaded by Gradle).
        // local.properties overrides for developers who prefer not to commit creds.
        reverealX {
            def props = new Properties()
            def lp = rootProject.file('local.properties')
            if (lp.exists()) props.load(new FileInputStream(lp))

            def sf  = props.getProperty('signing.storeFile')  ?: findProperty('signing.storeFile')  ?: 'Reveral_X_Mods.jks'
            def sp  = props.getProperty('signing.storePassword') ?: findProperty('signing.storePassword') ?: ''
            def ka  = props.getProperty('signing.keyAlias')    ?: findProperty('signing.keyAlias')    ?: 'reveral_x_mods'
            def kp  = props.getProperty('signing.keyPassword') ?: findProperty('signing.keyPassword') ?: ''

            // On CI the keystore may not be present — fall back to null so Gradle
            // uses the default debug keystore rather than crashing with "file not found".
            def ksFile = rootProject.file(sf)
            storeFile     ksFile.exists() ? ksFile : null
            storePassword sp
            keyAlias      ksFile.exists() ? ka : null
            keyPassword   ksFile.exists() ? kp : null
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.reverealX
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.reverealX
        }
    }

    ndkVersion "25.2.9519653"

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            // Required when android:extractNativeLibs="true" is set in the manifest.
            // Without this AGP 8.x aborts packageRelease with a hard error.
            useLegacyPackaging true
        }
        pickFirst 'META-INF/LICENSE'
        pickFirst 'META-INF/LICENSE.txt'
        pickFirst 'META-INF/LICENSE.md'
        pickFirst 'META-INF/NOTICE'
        pickFirst 'META-INF/NOTICE.txt'
        pickFirst 'META-INF/NOTICE.md'
        pickFirst 'META-INF/*.SF'
        pickFirst 'META-INF/*.DSA'
        pickFirst 'META-INF/*.RSA'
        pickFirst 'META-INF/BCKEY.DSA'
        pickFirst 'META-INF/BCKEY.SF'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/versions/9/module-info.class'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // APK signing — Google's official streaming signer (same lib the competitor uses)
    // Streams in 1 MB chunks; never loads the full APK into heap → no OOM on large APKs
    implementation 'com.android.tools.build:apksig:8.3.2'

    // Full BouncyCastle 1.80 (latest stable 2025) — universal keystore support.
    // Android ships a stripped BC that lacks JKS. We replace it at runtime with
    // the full library (Security.removeProvider("BC") + insertProviderAt(fullBC, 1)).
    // bcprov-jdk18on covers PKCS12, JKS, BKS, JCEKS, UBER, BCFKS — every format.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'

    // DEX processing — vova7878/DexFile replaces dexlib2.
    // Key benefit: WriteOptions.defaultOptions() uses RawFix.DO_NOT_TOUCH which
    // writes unknown/obfuscated instructions as raw bytes — no re-encode failure
    // on bystander classes. L3/L4/L5 fallbacks are no longer needed.
    implementation 'io.github.vova7878:DexFile:v1.6.0'

    // XZ decompression — used to extract the optional OLLVM NDK (.tar.xz release).
    // Tukaani XZ for Java is the standard lightweight implementation (~80 KB).
    implementation 'org.tukaani:xz:1.9'

    // ── VMP (maoabc/nmmp port) dependencies ─────────────────────────────────
    // smali/dexlib2 — DEX parser used by the VMP converter to walk method
    // bytecode and rewrite Dalvik opcodes to the randomised custom opcode set.
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.9'

    // Guava — used by JniCodeGenerator (HashMultimap, Ordering, Iterables, etc.)
    implementation 'com.google.guava:guava:33.2.1-android'

    // JSR-305 annotations (@Nonnull / @Nullable) required by smali/dexlib2
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
}
