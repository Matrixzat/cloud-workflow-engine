name: Build libcipher (arm64 + arm32 OLLVM)

# ─────────────────────────────────────────────────────────────────────────────
# Two-job workflow:
#
#  Job 1 — build-ollvm
#    Builds OLLVM clang-19 for x86_64 Linux with BOTH AArch64 AND ARM targets.
#    Cached by source hash — skips rebuild if asset already exists on release.
#    Tag: ollvm-clang-linux-v2  (bumped from v1 to pick up ARM target)
#
#  Job 2 — build-guard
#    Uses the OLLVM clang to compile guard.cpp with all 8 OLLVM passes for:
#      libcipher_arm64.a       — arm64-v8a   (OLLVM all 8 passes)
#      libcipher_armeabi-v7a.a — armeabi-v7a (OLLVM all 8 passes — ARM target now included)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    paths:
      - 'cpp/guard.cpp'
      - 'cpp/guard_pstrings.inc'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Build OLLVM clang-19 (AArch64 + ARM targets, x86_64 Linux host)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-ollvm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    outputs:
      asset_id: ${{ steps.resolve.outputs.asset_id }}

    steps:
      - name: Check if OLLVM v2 asset already exists
        id: check
        run: |
          ASSET_ID=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/ollvm-clang-linux-v2" \
            | jq -r '.assets[]? | select(.name=="ollvm-clang-linux-x86_64.tar.xz") | .id' \
            | head -1)
          echo "asset_id=${ASSET_ID}" >> $GITHUB_OUTPUT
          if [ -n "$ASSET_ID" ]; then
            echo "✅ OLLVM v2 asset exists (ID: $ASSET_ID) — skipping rebuild"
          else
            echo "⚠️  No OLLVM v2 asset — will build from source (AArch64 + ARM)"
          fi

      - name: Install build dependencies
        if: steps.check.outputs.asset_id == ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake python3 git lld
          echo "Cores: $(nproc)  RAM: $(free -h | awk '/^Mem:/{print $2}')"

      - name: Clone OLLVM source (shallow)
        if: steps.check.outputs.asset_id == ''
        run: |
          git clone --depth=1 https://github.com/TIMER-err/ollvm-19 /tmp/ollvm-src
          git -C /tmp/ollvm-src rev-parse HEAD | tee /tmp/ollvm-src-hash.txt

      - name: Restore build cache
        id: cache-ollvm
        if: steps.check.outputs.asset_id == ''
        uses: actions/cache@v4
        with:
          path: /tmp/ollvm-install
          key: ollvm-install-${{ runner.os }}-AArch64-ARM-${{ hashFiles('/tmp/ollvm-src-hash.txt') }}

      - name: Configure CMake (AArch64 + ARM)
        if: steps.check.outputs.asset_id == '' && steps.cache-ollvm.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_INSTALL_PREFIX=/tmp/ollvm-install \
            -B /tmp/ollvm-build \
            /tmp/ollvm-src/llvm

      - name: Build clang (AArch64 + ARM)
        if: steps.check.outputs.asset_id == '' && steps.cache-ollvm.outputs.cache-hit != 'true'
        run: ninja -C /tmp/ollvm-build -j$(nproc) clang

      - name: Install clang
        if: steps.check.outputs.asset_id == '' && steps.cache-ollvm.outputs.cache-hit != 'true'
        run: |
          ninja -C /tmp/ollvm-build install-clang install-clang-resource-headers
          /tmp/ollvm-install/bin/clang --version

      - name: Smoke-test OLLVM (arm64 + arm32)
        if: steps.check.outputs.asset_id == ''
        run: |
          echo "int main(){return 0;}" > /tmp/test.c
          /tmp/ollvm-install/bin/clang \
            --target=aarch64-linux-android26 \
            -mllvm -fla -mllvm -bcf -mllvm -sub \
            -fPIC -O2 -c /tmp/test.c -o /tmp/test_arm64.o
          echo "✅ OLLVM arm64 passes OK"
          /tmp/ollvm-install/bin/clang \
            --target=armv7a-linux-androideabi21 \
            -mllvm -fla -mllvm -bcf -mllvm -sub \
            -fPIC -O2 -c /tmp/test.c -o /tmp/test_arm32.o
          echo "✅ OLLVM arm32 passes OK"

      - name: Package OLLVM clang
        if: steps.check.outputs.asset_id == ''
        run: |
          tar -cJf /tmp/ollvm-clang-linux-x86_64.tar.xz -C /tmp ollvm-install
          du -sh /tmp/ollvm-clang-linux-x86_64.tar.xz

      - name: Upload to release (tag ollvm-clang-linux-v2)
        if: steps.check.outputs.asset_id == ''
        run: |
          # Delete old release if exists
          OLD_ID=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/ollvm-clang-linux-v2" \
            | jq -r '.id // empty')
          if [ -n "$OLD_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$OLD_ID"
            git push origin :refs/tags/ollvm-clang-linux-v2 2>/dev/null || true
            sleep 2
          fi
          REL_ID=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d '{
              "tag_name": "ollvm-clang-linux-v2",
              "name": "OLLVM Clang v2 (AArch64 + ARM)",
              "body": "OLLVM clang-19 built with LLVM_TARGETS_TO_BUILD=AArch64;ARM.\nBoth arm64 and arm32 guard.cpp now compiled with all 8 OLLVM passes.",
              "prerelease": true
            }' | jq -r '.id')
          echo "Release ID: $REL_ID"
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/x-xz" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=ollvm-clang-linux-x86_64.tar.xz" \
            --data-binary @/tmp/ollvm-clang-linux-x86_64.tar.xz \
            | jq '{id, name, size}'

      - name: Resolve asset ID for build-guard
        id: resolve
        run: |
          ASSET_ID=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/ollvm-clang-linux-v2" \
            | jq -r '.assets[] | select(.name=="ollvm-clang-linux-x86_64.tar.xz") | .id' \
            | head -1)
          echo "asset_id=${ASSET_ID}" >> $GITHUB_OUTPUT
          echo "OLLVM v2 asset ID: $ASSET_ID"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Build libcipher (arm64 + arm32, both with OLLVM)
# ─────────────────────────────────────────────────────────────────────────────
  build-guard:
    runs-on: ubuntu-latest
    needs: build-ollvm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r28c (sysroot + linker wrappers)
        run: |
          yes | sdkmanager "ndk;28.0.13004108" 2>/dev/null || \
          yes | sdkmanager "ndk;27.2.12479018" 2>/dev/null || \
          yes | sdkmanager "ndk;25.2.9519653"  2>/dev/null || true
          NDK_ROOT=$(ls -d $ANDROID_SDK_ROOT/ndk/28* 2>/dev/null | head -1 || \
                     ls -d $ANDROID_SDK_ROOT/ndk/27* 2>/dev/null | head -1 || \
                     ls -d $ANDROID_SDK_ROOT/ndk/25* 2>/dev/null | head -1)
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "Using NDK: $NDK_ROOT"

      - name: Download OLLVM v2 clang
        run: |
          ASSET_ID="${{ needs.build-ollvm.outputs.asset_id }}"
          echo "Downloading OLLVM v2 asset ID: $ASSET_ID"
          curl -L -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID" \
            -o ollvm-clang-linux-x86_64.tar.xz
          echo "Downloaded: $(du -sh ollvm-clang-linux-x86_64.tar.xz | cut -f1)"
          tar -xJf ollvm-clang-linux-x86_64.tar.xz
          chmod +x ollvm-install/bin/clang++
          echo "✅ OLLVM: $(ollvm-install/bin/clang++ --version | head -1)"
          echo "OLLVM_BIN=$PWD/ollvm-install/bin/clang++" >> $GITHUB_ENV

      - name: Resolve toolchain paths
        run: |
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CLANG_OLLVM=$OLLVM_BIN"                                        >> $GITHUB_ENV
          echo "NDK_LINK_ARM64=$TC/bin/aarch64-linux-android26-clang++"        >> $GITHUB_ENV
          echo "NDK_LINK_ARM32=$TC/bin/armv7a-linux-androideabi21-clang++"     >> $GITHUB_ENV
          echo "SYSROOT=$TC/sysroot"                                           >> $GITHUB_ENV
          echo "TC=$TC"                                                         >> $GITHUB_ENV

      - name: Confirm OLLVM passes (arm64 + arm32)
        run: |
          echo "int x;" > /tmp/probe.c
          OLLVM_OK=0
          if "$OLLVM_BIN" --target=aarch64-linux-android26 \
               --sysroot="$SYSROOT" -mllvm -fla \
               -x c -c /tmp/probe.c -o /tmp/probe.o 2>/dev/null; then
            OLLVM_OK=1
            echo "✅ OLLVM arm64 pass check OK"
          fi
          if "$OLLVM_BIN" --target=armv7a-linux-androideabi21 \
               --sysroot="$SYSROOT" -mllvm -fla \
               -x c -c /tmp/probe.c -o /tmp/probe_arm32.o 2>/dev/null; then
            echo "✅ OLLVM arm32 pass check OK"
          fi
          if [ "$OLLVM_OK" = "1" ]; then
            echo "OLLVM_FLAGS=-mllvm -fla -mllvm -bcf -mllvm -bcf_prob=80 -mllvm -bcf_loop=3 -mllvm -sub -mllvm -sub_loop=3 -mllvm -sobf -mllvm -split -mllvm -split_num=5 -mllvm -ibr -mllvm -icall -mllvm -igv" >> $GITHUB_ENV
            echo "✅ All 8 passes: fla bcf(80%×3) sub(×3) sobf split(5) ibr icall igv"
          else
            echo "OLLVM_FLAGS=" >> $GITHUB_ENV
            echo "⚠️  OLLVM not responding — building without obfuscation"
          fi

      - name: Build libcipher archives (arm64 + arm32)
        run: |
          set -e
          SRC="cpp"

          CPP_STATIC_ARM64=$(find "$TC" -name "libc++_static.a" | grep "aarch64"    | head -1)
          CPP_ABI_ARM64=$(   find "$TC" -name "libc++abi.a"     | grep "aarch64"    | head -1)
          CPP_STATIC_ARM32=$(find "$TC" -name "libc++_static.a" | grep "arm-linux"  | head -1)
          CPP_ABI_ARM32=$(   find "$TC" -name "libc++abi.a"     | grep "arm-linux"  | head -1)

          COMMON_BASE=(
            --sysroot="$SYSROOT"
            -fPIC -O2 -g0
            -fno-unwind-tables -fno-asynchronous-unwind-tables
            -fexceptions -frtti
            -fvisibility=hidden
            -ffunction-sections -fdata-sections
            -D__ANDROID__ -DANDROID
            -DD2C_HAS_JNILOAD
            -I"$SRC"
          )

          COMMON_OLLVM=("${COMMON_BASE[@]}")
          if [ -n "$OLLVM_FLAGS" ]; then
            read -ra OF <<< "$OLLVM_FLAGS"
            COMMON_OLLVM+=("${OF[@]}")
          fi

          GUARD="$SRC/guard.cpp"

          # ── arm64-v8a — OLLVM all 8 passes ───────────────────────────────────
          echo "=== Building arm64-v8a (OLLVM) ==="
          "$CLANG_OLLVM" --target=aarch64-linux-android26 \
            "${COMMON_OLLVM[@]}" -std=c++17 \
            -c "$GUARD" -o guard_arm64.o
          "$NDK_LINK_ARM64" \
            -shared -fPIC -Wl,--gc-sections -Wl,--build-id=none \
            -Wl,-soname,libcipher.so \
            -nostdlib++ "$CPP_STATIC_ARM64" "$CPP_ABI_ARM64" \
            -llog -lz -lm guard_arm64.o \
            -o libcipher_arm64.so
          "$TC/bin/llvm-ar" rcs libcipher_arm64.a guard_arm64.o
          echo "  ✅ libcipher_arm64.a  — $(wc -c < libcipher_arm64.a) bytes"
          echo "  ✅ libcipher_arm64.so — $(wc -c < libcipher_arm64.so) bytes"

          # ── armeabi-v7a — OLLVM all 8 passes (ARM target now in clang) ────────
          echo "=== Building armeabi-v7a (OLLVM) ==="
          "$CLANG_OLLVM" --target=armv7a-linux-androideabi21 \
            "${COMMON_OLLVM[@]}" -std=c++17 \
            -c "$GUARD" -o guard_arm32.o
          "$NDK_LINK_ARM32" \
            -shared -fPIC -Wl,--gc-sections -Wl,--build-id=none \
            -Wl,-soname,libcipher.so \
            -nostdlib++ "$CPP_STATIC_ARM32" "$CPP_ABI_ARM32" \
            -llog -lz -lm guard_arm32.o \
            -o libcipher_armeabi-v7a.so
          "$TC/bin/llvm-ar" rcs libcipher_armeabi-v7a.a guard_arm32.o
          echo "  ✅ libcipher_armeabi-v7a.a  — $(wc -c < libcipher_armeabi-v7a.a) bytes"
          echo "  ✅ libcipher_armeabi-v7a.so — $(wc -c < libcipher_armeabi-v7a.so) bytes"

      - name: Strip + harden
        run: |
          STRIP="$TC/bin/llvm-strip"
          OBJCOPY="$TC/bin/llvm-objcopy"
          SECS=(.symtab .strtab .comment .note.android.ident .eh_frame .eh_frame_hdr)
          for SO in libcipher_arm64.so libcipher_armeabi-v7a.so; do
            "$STRIP" --strip-all "$SO"
            for S in "${SECS[@]}"; do "$OBJCOPY" --remove-section="$S" "$SO" 2>/dev/null || true; done
            echo "  $SO → $(wc -c < "$SO") bytes"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cipher-binaries
          retention-days: 90
          path: |
            libcipher_arm64.so
            libcipher_arm64.a
            libcipher_armeabi-v7a.so
            libcipher_armeabi-v7a.a
